<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=../../social/base-color.css><link rel=stylesheet href=cover.css>
<style>html,body{width:100vw;height:100vh}
/* Designed at 1128x191 (LinkedIn page cover); the 4200x700 render zooms the same layout.
   The page logo overlaps the bottom-left on desktop, so the text starts at 300px. */
.cv{padding:0 56px 0 300px;justify-content:space-between;gap:28px}
h1{font-size:34px;white-space:nowrap}.sub{font-size:15px;margin-top:8px;white-space:nowrap}.cv>div:first-child{flex:none}
.pills{gap:8px;justify-content:flex-end;max-width:330px}.pills .pill{font-size:13px;padding:6px 12px}
.pill small{font-weight:500;opacity:.75;margin-left:4px;font-size:11px}</style>
<script>addEventListener("DOMContentLoaded",()=>{const z=innerWidth/1128;document.body.style.zoom=z;document.body.style.width="1128px";document.body.style.height=(innerHeight/z)+"px"})</script></head>
<body><div class=cv><div><h1>Run your entire marketing<br>using an <span>AI agent.</span></h1><p class=sub>Social, content, SEO &amp; AI search and email, every week. You approve.</p></div>
<div class=pills><span class="pill mk">Social media</span><span class="pill ad">Ads<small>· early access</small></span><span class="pill ct">Content</span><span class="pill se">SEO &amp; AI search</span><span class="pill em">Email</span></div></div></body></html>
